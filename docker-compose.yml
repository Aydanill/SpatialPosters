# SpatialPosters, prebuilt image (no build, no git needed).
#   1. Replace the CHANGE ME values.
#   2. docker compose up -d
#   3. Open http://<this-machine>:8080/jellyfin and unlock it with your PIN.
# To update later: docker compose pull && docker compose up -d
services:
  spatialposters:
    image: ghcr.io/aydanill/spatialposters:latest
    container_name: spatialposters
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # CHANGE ME: TMDB v3 API key
      - SPATIALPOSTERS_TMDB_KEY=your_tmdb_v3_key
      # CHANGE ME: how this container reaches Jellyfin (e.g. http://192.168.1.10:8096)
      - SPATIALPOSTERS_JELLYFIN_URL=http://YOUR_JELLYFIN_HOST:8096
      # Jellyfin Dashboard > API Keys
      - SPATIALPOSTERS_JELLYFIN_API_KEY=your_jellyfin_api_key
      # CHANGE ME: PIN that unlocks settings and the Jellyfin page
      - SPATIALPOSTERS_ADMIN_PIN=choose_a_pin
      # Behind a reverse proxy and saving fails with "Cross-origin request rejected"? Add your domain:
      # - SPATIALPOSTERS_ALLOWED_HOSTS=posters.example.com
    volumes:
      - spatialposters-data:/data

volumes:
  spatialposters-data:
